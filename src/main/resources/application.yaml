server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-alias: joi-delivery

# Plain-HTTP port that redirects to the HTTPS port above
http:
  port: 8080

spring:
  application:
    name: delivery
  datasource:
    url: jdbc:h2:mem:joidelivery
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create